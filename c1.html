<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact | Domestic Violence Help Portal</title>
  <link rel="stylesheet" href="style1.css">
</head>
<body>
  <header>
    <h1>Contact Us</h1>
  </header>

  <nav>
    <a href="in.html">Home</a>
    <a href="about.html">About</a>
    <a href="legal.html">Legal Help</a>
    <a href="counselling.html">Counselling</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>

  <section class="content">
    <h2>Get in Touch</h2>
    <p>📞 <b>Helpline (24x7):</b> 181</p>
    <p>📧 <b>Email:</b> <a href="mailto:help@dvportal.org">help@dvportal.org</a></p>
    <p>🏠 <b>Address:</b> Domestic Violence Support Center, Hyderabad, India</p>

    <h2>Send Us a Message</h2>
    <form>
      <label for="name">Your Name:</label>
      <input type="text" id="name" placeholder="Enter your name" required>

      <label for="email">Your Email:</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label for="message">Your Message:</label>
      <textarea id="message" placeholder="Write your message here..." required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2025 Domestic Violence Support Portal</p>
  </footer>
</body>
</html>
